name: Feature proposal
description: Describe a problem the plugin could solve.
labels: [proposal]
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem, not the solution. Other providers, a team view and custom status formats
        are out of scope for now (see CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: How it could work. Keep zero dependencies in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What you tried or considered instead.
